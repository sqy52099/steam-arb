name: probe

# 临时探针 v3：物品页在「大间隔」下能不能稳定拿到。
# 已知：单发物品页 200（544KB），连打 2.5 秒间隔全 429。
# 那就量一下间隔和成功率的关系，好定 STEAM_GAP。
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe.yml

permissions:
  contents: write

env:
  OUT_DIR: /tmp/probelog

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 探针
        run: |
          set +e
          mkdir -p "$OUT_DIR"
          cd collector
          python - <<'PY'
          import json, os, sys, time
          sys.path.insert(0, os.getcwd())
          import run, steam as st

          cand = run.fetch_candidates("probe ")
          ranked = run.pick_candidates(cand) if cand else []
          print("候选 %d，粗排后 %d" % (len(cand or {}), len(ranked)))
          if not ranked:
              sys.exit(0)

          # 每种间隔试 6 件，从池子里挑不同物品避免重复命中缓存
          # 第四组先干等 90 秒再按 2.5 秒间隔打 3 件，用来分辨限流是
          # 「按速率算」还是「窗口式」：前者冷却后仍然会撞，后者冷却后能过。
          plans = [(2.5, 6, 0), (8.0, 6, 0), (15.0, 6, 0), (2.5, 3, 90)]
          results = []
          idx = 0
          for gap, n, cool in plans:
              if cool:
                  print("  冷却 %d 秒…" % cool)
                  time.sleep(cool)
              st.LIMITER.gap = gap
              st.LIMITER.strikes = 0
              ok = bad = 0
              errs = []
              t0 = time.monotonic()
              for _ in range(n):
                  if idx >= len(ranked):
                      break
                  hn = ranked[idx]; idx += 1
                  try:
                      ob = st.item_orderbook(hn)
                      ok += 1
                      print("  gap=%.1f  %-40s OK  bid=%s sell=%s" % (
                          gap, hn[:40], ob["usd_bid"], ob["usd_sell"]))
                  except Exception as e:
                      bad += 1
                      errs.append(type(e).__name__ + ":" + str(e)[:40])
                      print("  gap=%.1f  %-40s %s" % (gap, hn[:40], type(e).__name__))
              el = time.monotonic() - t0
              row = {"gap": gap, "ok": ok, "bad": bad, "cool": cool,
                     "seconds": round(el, 1),
                     "rate": round(ok / el * 60, 1) if el > 0 else 0,
                     "errs": errs[:4]}
              results.append(row)
              print("  → gap=%.1f cool=%d 成功 %d/%d  %.0fs  %.1f 件/分" % (
                  gap, cool, ok, n, el, row["rate"]))

          out = {"results": results,
                 "summary": "; ".join("gap%.1f/cool%d: %d/%d" % (
                     r["gap"], r["cool"], r["ok"], r["ok"] + r["bad"])
                     for r in results)}
          print("\n" + out["summary"])
          fp = os.path.join(os.environ.get("OUT_DIR", "/tmp/probelog"), "probe.json")
          with open(fp, "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=1)
          print("写了", fp)
          PY

      - name: 推结果
        run: |
          set -e
          cd "$OUT_DIR"
          git init -q
          git config user.name probe
          git config user.email probe@local
          git checkout -q -b probe-log
          git add -A
          git commit -q -m "probe v3 $(date -u +%Y-%m-%dT%H:%MZ)" || echo "没有变化"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q -f origin probe-log
