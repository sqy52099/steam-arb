name: probe

# 临时探针 v4：查清「哪些请求会被 429」。
#
# 已知事实：
#   * 探针 v2：同一台 runner、同一时刻，priceoverview 429（122ms），
#     物品页 market/listings/730/Prisma Case 200（544KB，362ms）。
#   * collect 真跑：4 个 shard 各打 10 次，全部 429，0/40 成功。
#   * 探针 v3 想量间隔，但抓候选太慢（waxpeer 两万七千条），
#     20 分钟跑不完被取消。
#
# 所以这版不抓候选，直接用写死的物品名，只打 9 次，两分钟内出结果。
# 要回答的是：普通箱子 vs 粗排前列的稀有物品，限流是否不同；
# 以及冷却一分钟后能不能恢复。
on:
  # 只留手动触发。原来是 push 到本文件就跑，现在探针已经给出结论，
  # 再自动跑只会继续往封禁里加请求。
  workflow_dispatch:

permissions:
  contents: write

env:
  OUT_DIR: /tmp/probelog

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 探针
        run: |
          set +e
          mkdir -p "$OUT_DIR"
          cd collector
          python - <<'PY'
          import json, os, sys, time
          sys.path.insert(0, os.getcwd())
          import steam as st

          # 第一组：普通箱子，谁都能开，探针 v2 里这类能拿到 200
          common = ["Prisma Case", "Fracture Case",
                    "Dreams & Nightmares Case"]
          # 第二组：粗排前列的稀有物品，collect 真跑里打的就是这类
          rare = ["★ Butterfly Knife | Crimson Web (Minimal Wear)",
                  "M4A1-S | Imminent Danger (Well-Worn)",
                  "★ Karambit | Night (Factory New)"]

          def one(name, tag):
              url = (st.BASE + "/market/listings/730/"
                     + st.urllib.parse.quote(name, safe=""))
              t0 = time.monotonic()
              code, raw = st._fetch(url, st.HTML_HEADERS,
                                    timeout=st.FETCH_TIMEOUT, retries=0)
              ms = round((time.monotonic() - t0) * 1000)
              print("  %-6s %-45s code=%-4s %5sms %7s bytes" % (
                  tag, name[:45], code, ms, len(raw)))
              return {"tag": tag, "name": name, "code": code,
                      "ms": ms, "bytes": len(raw)}

          rows = []

          print("第一组：普通箱子，间隔 5 秒")
          for n in common:
              rows.append(one(n, "common"))
              time.sleep(5)

          print("第二组：稀有物品，间隔 5 秒")
          for n in rare:
              rows.append(one(n, "rare"))
              time.sleep(5)

          print("冷却 60 秒…")
          time.sleep(60)

          print("第三组：普通箱子复打，间隔 5 秒")
          for n in common:
              rows.append(one(n, "again"))
              time.sleep(5)

          codes = {}
          for r in rows:
              k = "%s:%s" % (r["tag"], r["code"])
              codes[k] = codes.get(k, 0) + 1
          out = {"rows": rows, "codes": codes,
                 "summary": " ".join("%s=%d" % (k, v)
                                     for k, v in sorted(codes.items()))}
          print("\n" + out["summary"])
          fp = os.path.join(os.environ["OUT_DIR"], "probe.json")
          with open(fp, "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=1)
          print("写了", fp)
          PY

      - name: 推结果
        run: |
          set -e
          cd "$OUT_DIR"
          git init -q
          git config user.name probe
          git config user.email probe@local
          git checkout -q -b probe-log
          git add -A
          git commit -q -m "probe v4 $(date -u +%Y-%m-%dT%H:%MZ)" || echo "没有变化"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q -f origin probe-log
