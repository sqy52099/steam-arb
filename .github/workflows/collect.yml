name: collect

# Steam 社区市场在国内不可达，所以采集必须跑在境外出口上。
# GitHub Actions 的 runner 由 Azure 托管，可以直接访问 steamcommunity.com。
#
# 注意：
#   * cron 最短 5 分钟，但实际会延迟 5~15 分钟，别指望准点
#   * 私有仓库免费额度 2000 分钟/月，这种跑法会超额 → 仓库设成 public
#   * 数据存在 data 分支，每轮 fetch 下来、跑完 push 回去（depth=1，不会越拖越大）

on:
  schedule:
    # 每 30 分钟一轮。不要改成 */10 —— 一轮实际要跑 15~20 分钟，
    # 间隔比耗时短的话队列会越堆越多，最后全是排队等超时的废跑。
    - cron: "*/30 * * * *"
  workflow_dispatch:        # 允许手动点一次，方便第一次验证
  push:
    branches: [main]
    # 只在动到采集/前端时才跑：改了代码就等于顺手验一次，
    # 纯文档提交不会白烧一轮 runner。
    paths:
      - "collector/**"
      - "web/**"
      - "build_site.py"
      - ".github/workflows/collect.yml"

permissions:
  contents: write
  # 前端是纯静态页，直接由本 job 发布到 Pages（不用再单独开一个 workflow）
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

env:
  DATA_DIR: /tmp/arbdata
  REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 取主分支代码
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 准备 data 分支
        run: |
          set -e
          rm -rf "$DATA_DIR"
          mkdir -p "$DATA_DIR"
          cd "$DATA_DIR"
          git init -q
          git config user.name  "arb-bot"
          git config user.email "arb-bot@users.noreply.github.com"
          git remote add origin "$REPO_URL"
          if git fetch -q --depth=1 origin data 2>/dev/null; then
            git checkout -q -B data FETCH_HEAD
            echo "已取到 data 分支"
          else
            git checkout -q --orphan data
            echo "data 分支不存在，本轮新建"
          fi
          mkdir -p data

      - name: 采集
        env:
          ARB_DB: /tmp/arbdata/data/arb.db
          ARB_DATA: /tmp/arbdata/data
          USD_CNY: ${{ vars.USD_CNY }}
          STEAM_GAP: "3.5"
        run: |
          set +e
          cd collector
          # 请求预算：列表 60 页 + 补 30 个 nameid + 查 120 件求购价
          #   = 210 个请求 × 3.5s ≈ 12 分钟，留出 checkout/push 的余量
          # --deadline 12：采集自己卡 12 分钟，到点收工，绝不撞 job 的 25 分钟硬超时
          python run.py --batch 120 --pages 60 --nameid-budget 30 --deadline 12
          rc=$?
          echo "collector exit=$rc"
          # 采集失败也继续：可能已经有部分数据入库，导出旧数据比什么都没有好
          ls -la "$ARB_DATA"
          exit 0

      - name: 回写 data 分支
        run: |
          set -e
          cd "$DATA_DIR"
          git add -A data
          if git diff --cached --quiet; then
            echo "没有变化，跳过 push"
          else
            git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin data
            echo "已推送"
          fi

      - name: 汇总
        run: |
          {
            echo "### 采集结果"
            python - <<'PY'
          import json, os, time
          fp = os.path.join(os.environ.get("DATA_DIR", "/tmp/arbdata"),
                            "data", "latest.json")
          if not os.path.exists(fp):
              print("")
              print("**❌ 没有产出 latest.json —— 本轮整体失败**")
              print("::error::本轮没有产出 latest.json")
              raise SystemExit
          d = json.load(open(fp, encoding="utf-8"))

          # 采集失败也 exit 0（为了保住旧数据），所以「这一轮通不通」
          # 只能看 health，不能看 job 是绿是红。
          h = d.get("health") or {}
          parts = [("thirdparty", "第三方买入价"),
                   ("steam_list", "Steam 物品列表"),
                   ("nameid", "补 nameid"),
                   ("steam_orders", "Steam 求购价")]
          dead = []
          print("")
          print("| 环节 | 状态 | 详情 |")
          print("| --- | --- | --- |")
          for k, label in parts:
              v = h.get(k)
              if not v:
                  print("| %s | ❔ 未记录 | 这一轮没走到 |" % label)
                  continue
              ok = bool(v.get("ok"))
              if not ok and k in ("steam_list", "steam_orders"):
                  dead.append(label)
              detail = (v.get("detail") or "").replace("|", "\\|")
              print("| %s | %s | %s |" % (label, "✅" if ok else "❌", detail))

          age = (time.time() - d["generated"]) / 60
          print("")
          print("- 手上 %d 件，数据生成于 %s（%.0f 分钟前）"
                % (d["count"],
                   time.strftime("%Y-%m-%d %H:%M", time.localtime(d["generated"])),
                   age))
          if dead:
              sep = "、"
              msg = "%s 失败 —— 多半是 runner 出口被 Steam 拦了，本轮页面数字不变" \
                    % sep.join(dead)
              print("")
              print("**❌ %s**" % msg)
              print("::error::%s" % msg)
          top = sorted(d["items"], key=lambda x: -(x.get("ratio") or 0))[:8]
          if top:
              print("")
              print("| 面值比 | 物品 | 买入 | 净得 | 24h 成交 |")
              print("| --- | --- | --- | --- | --- |")
              for it in top:
                  # 物品名里几乎都带 " | "（AK-47 | Redline），不转义会把表格列撑破
                  name = (it.get("n") or "").replace("|", "\\|")
                  print("| %.3f | %s | ¥%.2f | ¥%.2f | %s |"
                        % (it.get("ratio") or 0, name, it.get("buy") or 0,
                           it.get("net") or 0, it.get("vol") or 0))
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      # 采集完顺手把静态页发到 Pages。这样只用一个 workflow：
      # 数据更新和页面更新永远同步，不会出现页面比数据新/旧的问题。
      - name: 构建静态页
        env:
          ARB_DATA: /tmp/arbdata/data
        run: python build_site.py

      - uses: actions/configure-pages@v5
        with:
          # 第一次跑时仓库里 Pages 还没开，这里直接调 API 打开，
          # 省掉「先去 Settings 点一下」那步。开了之后它就是空操作。
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    # 采集那步哪怕标红，只要这份数据还写得出来，页面也该继续用旧的数字，
    # 所以只在 job 被取消时跳过，失败也照样部署。
    if: ${{ !cancelled() }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
