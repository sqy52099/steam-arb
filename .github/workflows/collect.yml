name: collect

# Steam 社区市场在国内不可达，所以采集必须跑在境外出口上。
# GitHub Actions 的 runner 由 Azure 托管，可以直接访问 steamcommunity.com。
#
# 为什么是「4 个 shard 并行 + 1 个 merge」而不是一个 job 串完：
#   实测 Steam 对机房 IP 按接口区别对待 —— market/search/render 全 429，
#   只能靠抓物品页 HTML 拿盘口。物品页吞吐约 12 件/分钟，一个 job 12 分钟
#   只够采 140 件，而候选有 6000+。但每个 job 的出口 IP 不同、限流额度独立
#   （连续 11 次探针拿到 11 个不同 IP），所以并行是唯一能放大的手段。
#
# 注意：
#   * cron 最短 5 分钟，但实际会延迟 5~15 分钟，别指望准点
#   * 私有仓库免费额度 2000 分钟/月，这种跑法会超额 → 仓库设成 public
#   * 数据存在 data 分支，merge job 每轮 fetch 下来、算完 push 回去（depth=1）

on:
  # 每 30 分钟一轮。一轮实际 10~15 分钟，间隔比耗时短的话队列会越堆越多，
  # 最后全是排队等超时的废跑。
  #
  # 2026-11-18 曾经连注释掉过一阵：连续 8 轮物品页全是 429 / HTTP 0、
  # 一件没采到，那时候每 30 分钟重试只是白烧 runner。现在开了回来，
  # 但出口被限流时记得看 Summary —— 连着几轮 ❌ 就说明该换出口了。
  # 2026-11-18 第二次停掉。这次有实测依据：探针 v4 连打 9 次物品页，
  # 普通箱子和稀有物品**全部** 429，冷却 60 秒再打还是一样 429，且响应
  # 时间从 3.8 秒一路涨到 7.6 秒 —— 是限流在持续加深，不是偶发。
  # 每 30 分钟 4x120 次请求只会让封禁一直续期，先停，等换了出口再开。
  # 手动 Run workflow 仍然可以跑一轮看情况。
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch:        # 允许手动点一次，方便第一次验证
    inputs:
      batch:
        description: "每个 shard 采几件（探情况时用小的，20 件约 2 分钟）"
        required: false
        default: "120"
  # push 触发也一起停了。原来「改了采集代码就等于顺手验一次」是对的，
  # 但前提是出口能用；现在每 push 一次就是 4x120 次 429，只会让封禁
  # 续期。等出口换好再把这四行 paths 放回来。
  # push:
  #   branches: [main]
  #   paths:
  #     - "collector/**"
  #     - "web/**"
  #     - "build_site.py"
  #     - ".github/workflows/collect.yml"

permissions:
  contents: write
  # 前端是纯静态页，直接由本 workflow 发布到 Pages（不用再单独开一个）
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

env:
  DATA_DIR: /tmp/arbdata
  REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
  # 并行路数。public 仓库同一 workflow 并发上限是 20 个 job，留足余量。
  SHARDS: "4"

jobs:
  # ---------- 阶段一：N 台机器各抓一段，只产出 JSON，不碰数据库 ----------
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      # 一路挂掉不该拖累其它路：它们各自采到的数据仍然有用
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取本片
        env:
          USD_CNY: ${{ vars.USD_CNY }}
          STEAM_GAP: "2.5"
          # 撞 429 后睡多久（秒，封顶值）。调小是有依据的：早期封顶 45 秒、
          # 按 3+4*strikes 递增，12 分钟里光睡就 576 秒，只试到 10 件、全 429。
          # 同期单发探针在同一出口能拿 200 —— 限流是窗口式的，撞窗口靠多试。
          STEAM_BACKOFF_CAP: "6"
          SHARD_ID: ${{ matrix.shard }}
          # 手动触发时用输入值；定时/push 用默认 120 件、12 分钟。
          BATCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.batch || '120' }}
          OUT_DIR: /tmp/shards
        run: |
          set +e
          cd collector
          # 请求预算：120 件 × 2.5s ≈ 5 分钟纯间隔，实测含 429 退避约 10 分钟。
          # --deadline 12 让它自己收工，绝不撞 job 的 18 分钟硬超时（硬杀时
          # 一步都没提交，整片白采）。
          # --pool-cap 400：先按第三方中间价粗排，只在前 400 名里轮转。
          # 不设上限的话六千多件候选一轮要四个多小时，12 分钟预算只够查到
          # 清单最前面几十件（按名字排序＝随机），好东西永远碰不到。
          # --give-up 40：退避封顶 6 秒之后，连着 40 次 429 大约只花 7 分钟，
          # 还在预算内；而停止尝试等于这一片彻底白跑，宁可多撞几次窗口。
          # --fx-samples 4：采完顺手标定折算比。这件事必须放在采集阶段，
          # 因为每个 collect job 有自己的出口 IP，四个都试总有一个能通；
          # merge 只有一个 IP，撞上限流就整轮退回汇率、价格全偏高 6%。
          python run.py --mode collect \
            --shard "$SHARD_ID" --shards "$SHARDS" \
            --batch "${BATCH}" --deadline 12 --fx-samples 4 \
            --pool-cap 400 --give-up 40 --net-give-up 5 \
            --out-dir "$OUT_DIR"
          echo "采集 exit=$?"
          # 采不到也要写出空 shard：merge 靠它的 health 判断这一路是被拦还是没数据
          ls -la "$OUT_DIR" || true
          exit 0

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: shard-${{ matrix.shard }}
          path: /tmp/shards/shard-*.json
          if-no-files-found: warn
          retention-days: 1

  # ---------- 阶段二：汇总、标定折算比、写库、出页面 ----------
  merge:
    needs: collect
    # 4 路全挂也照样跑：库里还留着上一轮的数据，页面继续能用
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          # 4 个 shard 落到同一个目录，merge 会自己按文件名读
          pattern: shard-*
          path: /tmp/shards
          merge-multiple: true

      - name: 准备 data 分支
        run: |
          set -e
          rm -rf "$DATA_DIR"
          mkdir -p "$DATA_DIR"
          cd "$DATA_DIR"
          git init -q
          git config user.name  "arb-bot"
          git config user.email "arb-bot@users.noreply.github.com"
          git remote add origin "$REPO_URL"
          if git fetch -q --depth=1 origin data 2>/dev/null; then
            git checkout -q -B data FETCH_HEAD
            echo "已取到 data 分支"
          else
            git checkout -q --orphan data
            echo "data 分支不存在，本轮新建"
          fi
          mkdir -p data

      - name: 合并入库
        env:
          ARB_DB: /tmp/arbdata/data/arb.db
          ARB_DATA: /tmp/arbdata/data
          USD_CNY: ${{ vars.USD_CNY }}
          STEAM_GAP: "2.5"
        run: |
          set +e
          cd collector
          ls -la /tmp/shards || true
          # 折算比标定要问 Steam 的 priceoverview（每样本 2 次请求），
          # 6 个样本 = 12 次，几十秒。
          python run.py --mode merge --in-dir /tmp/shards --fx-samples 6 --est-cap 1500
          code=$?
          echo "合并 exit=$code"
          # 退出码留在文件里给汇总那步看。不 exit 1 是为了让后面的
          # 「回写 data 分支」照跑（库里旧数据还有用），但崩了必须说出来 ——
          # 有一回 run_merge 抛 NameError，因为这步 exit 0，Summary 全绿、
          # 页面上还是旧数字，查了很久才发现。
          echo "$code" > /tmp/merge.exit
          ls -la "$ARB_DATA"
          exit 0

      - name: 回写 data 分支
        run: |
          set -e
          cd "$DATA_DIR"
          git add -A data
          if git diff --cached --quiet; then
            echo "没有变化，跳过 push"
          else
            git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin data
            echo "已推送"
          fi

      - name: 汇总
        run: |
          {
            echo "### 采集结果"
            python - <<'PY'
          import json, os, time
          fp = os.path.join(os.environ.get("DATA_DIR", "/tmp/arbdata"),
                            "data", "latest.json")
          if not os.path.exists(fp):
              print("")
              print("**❌ 没有产出 latest.json —— 本轮整体失败**")
              print("::error::本轮没有产出 latest.json")
              raise SystemExit
          d = json.load(open(fp, encoding="utf-8"))

          # 采集失败也 exit 0（为了保住旧数据），所以「这一轮通不通」
          # 只能看 health，不能看 job 是绿是红。
          h = d.get("health") or {}
          parts = [("thirdparty", "第三方买入价"),
                   ("steam_orders", "Steam 物品页"),
                   ("fx", "汇率折算比"),
                   ("merge", "合并入库")]
          dead = []
          print("")
          print("| 环节 | 状态 | 详情 |")
          print("| --- | --- | --- |")
          for k, label in parts:
              v = h.get(k)
              if not v:
                  print("| %s | ❔ 未记录 | 这一轮没走到 |" % label)
                  continue
              ok = bool(v.get("ok"))
              if not ok and k in ("steam_orders", "fx"):
                  dead.append(label)
              detail = (v.get("detail") or "").replace("|", "\\|")
              print("| %s | %s | %s |" % (label, "✅" if ok else "❌", detail))

          age = (time.time() - d["generated"]) / 60
          print("")
          print("- 手上 %d 件（实测 %d + 估算 %d），折算比 1 USD = ¥%s，"
                "数据生成于 %s（%.0f 分钟前）"
                % (d["count"], d.get("real", d["count"]), d.get("est", 0),
                   d.get("fx") or "—",
                   time.strftime("%Y-%m-%d %H:%M", time.localtime(d["generated"])),
                   age))
          if d.get("est"):
              print("- 估算的那 %d 件没有真实盘口，是用第三方中间价折出来的，"
                    "通常比能卖到的价高 10~20%，别当成真机会。" % d["est"])
          if dead:
              msg = ("%s 失败 —— 多半是 runner 出口被 Steam 拦了，本轮页面数字不变"
                     % "、".join(dead))
              print("")
              print("**❌ %s**" % msg)
              print("::error::%s" % msg)

          # fx 单独说清后果。沿用旧标定值和退回汇率严重程度不同，别混成一句。
          if d.get("fx_note"):
              print("")
              print("**⚠ %s。**" % d["fx_note"])

          # 合并那步的退出码。它自己 exit 0 是为了不让后面回写中断，
          # 但崩了要在这里标出来，否则 Summary 全绿而数字没更新。
          try:
              mcode = int(open("/tmp/merge.exit").read().strip())
          except Exception:
              mcode = None
          if mcode:
              print("")
              print("**❌ 合并入库那步崩了（exit %d）—— 上面的数字可能是旧的，"
                    "去 log 里看 traceback**" % mcode)
              print("::error::合并入库崩溃 exit %d" % mcode)
          top = sorted(d["items"], key=lambda x: -(x.get("ratio") or 0))[:8]
          if top:
              print("")
              print("| 面值比 | 物品 | 买入 | 净得 | 买盘深度 |")
              print("| --- | --- | --- | --- | --- |")
              for it in top:
                  # 物品名里几乎都带 " | "（AK-47 | Redline），不转义会把表格列撑破
                  name = (it.get("n") or "").replace("|", "\\|")
                  if it.get("est"):
                      name = "〔估〕" + name
                  depth = it.get("depth")
                  print("| %.3f | %s | ¥%.2f | ¥%.2f | %s |"
                        % (it.get("ratio") or 0, name, it.get("buy") or 0,
                           it.get("net") or 0,
                           depth if depth is not None else "—"))
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      # 采集完顺手把静态页发到 Pages。这样只用一个 workflow：
      # 数据更新和页面更新永远同步，不会出现页面比数据新/旧的问题。
      - name: 更新中文名查表
        run: |
          set +e
          # CSGO-API 出新的物品时这张表才需要变，所以失败不算错 ——
          # build_site.py 发现没有 zh.json 只会让物品名显示成英文。
          # 从 runner 直连 github.com（本机连不上，见 README）。
          python tools/build_zh_names.py --out data/zh.json
          echo "生成 exit=$?"

      - name: 构建静态页
        env:
          ARB_DATA: /tmp/arbdata/data
        run: python build_site.py

      - uses: actions/configure-pages@v5
        with:
          # 第一次跑时仓库里 Pages 还没开，这里直接调 API 打开，
          # 省掉「先去 Settings 点一下」那步。开了之后它就是空操作。
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ---------- 阶段三：发布 ----------
  deploy:
    needs: merge
    runs-on: ubuntu-latest
    # 采集那步哪怕标红，只要这份数据还写得出来，页面也该继续用旧的数字，
    # 所以只在 job 被取消时跳过，失败也照样部署。
    if: ${{ !cancelled() }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
